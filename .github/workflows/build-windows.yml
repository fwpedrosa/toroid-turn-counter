name: Build Windows exe
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q tests
      - run: pyinstaller packaging/ToroidCounter.spec --noconfirm --clean
      - uses: actions/upload-artifact@v4
        with:
          name: ToroidCounter-exe
          path: dist/ToroidCounter.exe
      - name: Read version
        id: ver
        shell: bash
        run: echo "v=$(python -c "import toroid_counter as t; print(t.__version__)")" >> "$GITHUB_OUTPUT"
      - name: Publish release with the exe (main branch and tags)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: Toroid Turn Counter v${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Download **ToroidCounter.exe** below and double-click it. No install, no license.
            Windows may warn the first time (unsigned app): More info -> Run anyway.
          files: dist/ToroidCounter.exe
