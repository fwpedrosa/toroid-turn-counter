name: Build Windows exe
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q tests
      - run: pyinstaller packaging/ToroidCounter.spec --noconfirm --clean
      - uses: actions/upload-artifact@v4
        with:
          name: ToroidCounter-exe
          path: dist/ToroidCounter.exe
      - name: Attach exe to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ToroidCounter.exe
